name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04    # the README floor; pinned because Ubuntu 26.04 images carry no Python 3.9
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Self-tests (every module both ways, then the fire drill)
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config
        run: python continuity/selftest.py --drill
      - name: First run as the README describes it (install, a session, digest, weave, the hook, uninstall)
        run: python .github/ci_smoke.py
